name: Reportar um problema
description: Conte o que aconteceu no CloudVault.
title: "[Problema] "
body:
  - type: input
    id: platform
    attributes:
      label: Versão e dispositivo
      placeholder: CloudVault 1.0.0, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Descreva os passos e o resultado esperado. Remova QR codes, chaves, tokens, senhas e dados de conta dos anexos.
    validations:
      required: true
